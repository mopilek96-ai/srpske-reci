name: Сверка со словарём

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [words.json, tools/dict_check.py]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Найти слова в Wiktionary
        run: python3 tools/dict_check.py
      - name: Сохранить отчёт
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "Без изменений"; else
            git commit -m "Отчёт сверки со словарём"
            git pull --rebase -q && git push
          fi
