name: Озвучка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Озвучить новые слова (Azure)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'northeurope' }}
        run: python3 tools/tts.py

      - name: Сохранить новые mp3 в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Новой озвучки нет"
          else
            git commit -m "Озвучка новых слов"
            git pull --rebase -q && git push
          fi

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp index.html app.js config.js words.json _site/
          cp -r audio _site/ 2>/dev/null || mkdir -p _site/audio
          # свежие версии скриптов после каждой публикации, без старого кэша браузера
          v="${GITHUB_SHA::8}"
          sed -i "s|src=\"config.js\"|src=\"config.js?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
